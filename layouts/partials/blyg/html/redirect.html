{{- /* Where an item's permalink used to be, before its kind changed (f/ <-> t/). */ -}}
<!doctype html>
<html lang="{{ site.Language.LanguageCode | default site.Language.Lang }}">
<head>
<meta charset="utf-8">
<title>{{ .to }}</title>
<link rel="canonical" href="{{ .to }}">
<meta http-equiv="refresh" content="0; url={{ .to }}">
</head>
<body><p><a href="{{ .to }}">{{ .to }}</a></p></body>
</html>
