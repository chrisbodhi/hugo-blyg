# A minimal site that imports hugo-blyg: the config every consuming site
# needs, and nothing else. CI builds it (see .github/workflows/ci.yml).
baseURL = "https://example.org/"
title = "hugo-blyg example"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "robotsTXT", "404"]

[params.blyg]
  level = 1   # optional; 1 is the default and the only level this module builds

[module]
  [[module.imports]]
    path = "github.com/chrisbodhi/hugo-blyg"

[outputFormats]
  [outputFormats.blygmanifest]
    mediaType = "application/json"
    isPlainText = true   # load-bearing; see the README
    baseName = "blyg"
  [outputFormats.blygfeed]
    mediaType = "application/rss+xml"
    baseName = "feed"
